<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script03.js"></script>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        canvas {
            display: block;
            background: black;
            border: 1px solid gray;
        }

        #controls {
            position: fixed;
            background-color: rgba(255,255,255,0.12);
            color: white;
            padding: 14px;
            min-width: 260px;
        }

        #controls label {
            display: block;
            margin-top: 10px;
            margin-bottom: 4px;
        }

        #controls input {
            width: 100%;
        }

        .value {
            font-weight: bold;
            margin-left: 8px;
        }
        
    </style>
</head>
<body onload="play()">
    <canvas id="canvas" width="800" height="600"></canvas>
    <div id="controls">
        <label for="gravitySlider">
            Grawitacja: <span id="gravityValue" class="value">0.15</span>
        </label>

        <input type="range" id="gravitySlider" min="0" max="0.5" step="0.01" value="0.15">

        <label for="particleSlider">
            Liczba cząsteczek: <span id="particleValue" class="value">200</span>
        </label>

        <input type="range" id="particleSlider" min="50" max="1000" step="10" value="200">
    </div>
</body>
</html>
